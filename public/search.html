<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - MovieBox</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2310b84d'/><path d='M12 9v14l11-7z' fill='white'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">
        <span class="logo-mark">M</span>
        <span class="logo-text">Movie<span>Box</span></span>
      </a>
      <form class="search-wrap" role="search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="site-search" class="search-input" type="search" placeholder="Search movies, TV shows..." aria-label="Search">
      </form>
      <nav class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container" style="padding-top:24px">
      <h1 id="results-title" class="section-title" style="font-size:24px;margin-bottom:20px">Search</h1>
      <div id="results-grid" class="grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="logo">
        <span class="logo-mark">M</span>
        <span class="logo-text">Movie<span>Box</span></span>
      </div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
      </div>
      <div>Built on the MovieBox API. For educational purposes only.</div>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
