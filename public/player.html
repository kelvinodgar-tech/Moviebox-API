<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Player - MovieBox</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2310b84d'/><path d='M12 9v14l11-7z' fill='white'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
</head>
<body data-page="player">
  <header class="site-header player-header">
    <div class="container">
      <a class="logo" href="index.html">
        <span class="logo-mark">M</span>
        <span class="logo-text">Movie<span>Box</span></span>
      </a>
      <form class="search-wrap" role="search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="site-search" class="search-input" type="search" placeholder="Search movies, TV shows..." aria-label="Search">
      </form>
      <nav class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <main>
    <div id="player-root"></div>
  </main>

  <div id="download-modal" class="modal" role="dialog" aria-modal="true" aria-label="Download options">
    <div class="modal-content">
      <div class="modal-head">
        <div id="download-title" class="modal-title">Download</div>
        <button class="modal-close" data-close-modal aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="download-body" class="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="logo">
        <span class="logo-mark">M</span>
        <span class="logo-text">Movie<span>Box</span></span>
      </div>
      <div class="footer-links">
        <a href="index.html">Home</a>
      </div>
      <div>Built on the <a href="https://github.com/kelvinodgar-tech/Moviebox-API" target="_blank" rel="noopener">MovieBox API</a>.</div>
    </div>
  </footer>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
